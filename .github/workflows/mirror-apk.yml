# Optional: copies the latest release APKs into /downloads on the main branch
# so the landing page can download them same-site and show a real progress bar.
name: Mirror release APKs to GitHub Pages

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download APKs from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf downloads && mkdir downloads
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir downloads

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A downloads
          git diff --cached --quiet || (git commit -m "Mirror latest APKs for in-page downloads" && git push)
