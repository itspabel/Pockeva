# Copies the latest release's Universal APK into /downloads on the default branch,
# so the landing page can download it same-site and show a real progress bar.
# Works with Pages set to "Deploy from a branch". Old APKs are removed from the
# folder each time, so /downloads only ever holds the latest release.
name: Mirror release APK to downloads

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download the Universal APK of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          echo "Mirroring release $TAG"
          rm -rf downloads && mkdir downloads
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*universal*.apk' --dir downloads
          ls -la downloads

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A downloads
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Mirror latest APK for in-page downloads"
            git push
          fi
