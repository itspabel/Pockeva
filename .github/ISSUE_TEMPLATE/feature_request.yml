name: Feature request
description: Suggest a focused improvement for Pockeva.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this request.
          required: true
        - label: This request describes one focused feature or improvement.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem or limitation you run into, not only the solution you have in mind.
      placeholder: "When I ..., I cannot ..., which means ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how you would like it to work.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Relevant area
      multiple: true
      options:
        - Dashboard
        - Income and expenses
        - Wallets and cards
        - Shopping list or reminders
        - Borrowing, loans and lending
        - Reports or PDF export
        - Backup and restore
        - Settings, profile or themes
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround you use today.

  - type: textarea
    id: context
    attributes:
      label: Additional context
