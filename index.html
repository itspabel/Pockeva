<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pockeva — Your money, in balance.</title>
    <meta name="description" content="Pockeva is an offline-first personal finance app for Android." />
    <style>
      :root {
        --bg: #08070d;
        --panel: #12101b;
        --text: #f5f2fc;
        --muted: #cfc9e0;
        --purple: #8b5cf6;
        --purple-2: #a78bfa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background: radial-gradient(circle at top, rgba(139, 92, 246, 0.18), transparent 35%), #08070d;
        color: var(--text);
      }
      .card {
        width: min(720px, calc(100% - 32px));
        background: rgba(18, 16, 27, 0.92);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        box-shadow: 0 24px 70px rgba(0,0,0,0.45);
        padding: 40px 28px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3.25rem);
        line-height: 1.15;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.08);
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .primary {
        background: linear-gradient(135deg, #8b5cf6, #a78bfa 52%, #e879f9 100%);
        color: #fff;
      }
      .secondary {
        background: rgba(255,255,255,0.02);
        color: var(--text);
      }
      .tag {
        display: inline-block;
        margin-top: 24px;
        padding: 7px 11px;
        border-radius: 999px;
        background: rgba(139, 92, 246, 0.12);
        border: 1px solid rgba(167, 139, 250, 0.28);
        color: var(--purple-2);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="tag">Pockeva v1.0.4</div>
      <h1>Your money, in balance.</h1>
      <p>Pockeva is an offline-first personal finance app for Android. Track income, expenses, wallets, shopping lists, and borrowing in one organized place.</p>

      <div class="actions">
        <a class="btn primary" href="https://github.com/itspabel/Pockeva/releases/download/v1.0.4/Pockeva-v1.0.4-universal.apk">Download APK</a>
        <a class="btn secondary" href="https://github.com/itspabel/Pockeva/releases/tag/v1.0.4">View release</a>
      </div>
    </main>
  </body>
</html>
